[project]
name = "llm-pico"
version = "0.1.0"
description = "Hyper-lightweight LLM proxy with OpenAI-compatible endpoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
llm-pico = "llm_pico.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_pico*"]
