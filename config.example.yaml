
litellm_settings:
  drop_params: true
  modify_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  cooldown_time: 45
  allowed_fails: 1
  circuit_breaker:
    enabled: true
    failure_threshold: 3
    recovery_timeout: 30

general_settings:
  master_key: "sk-pico-master-CHANGE-ME"
  db_path: "llm-pico.db"

