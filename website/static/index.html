<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Pico Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#111;--border:#222;--text:#e0e0e0;--muted:#888;--green:#3a8;--blue:#6bf;--orange:#fa8;--red:#e55;--purple:#b8f}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:13px;line-height:1.5}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 14px;border-radius:4px;transition:all .15s}
button:hover{border-color:var(--blue);color:var(--blue)}
button.danger{border-color:var(--red);color:var(--red)}
button.danger:hover{background:var(--red);color:#fff}
button.primary{background:var(--green);border-color:var(--green);color:#000}
button.primary:hover{opacity:.85}
input,select{font-family:inherit;font-size:12px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--blue)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.badge.green{background:#0a3a2a;color:var(--green)}
.badge.red{background:#3a0a0a;color:var(--red)}
.badge.blue{background:#0a1a3a;color:var(--blue)}
.badge.orange{background:#3a2a0a;color:var(--orange)}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px}
.stat-card{text-align:center}
.stat-card .val{font-size:28px;font-weight:700;color:var(--green)}
.stat-card .lbl{color:var(--muted);font-size:11px;margin-top:4px}
.progress-bar{background:var(--border);height:6px;border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .3s}

/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:40px;width:360px;text-align:center}
.login-box h1{font-size:18px;margin-bottom:4px}
.login-box p{color:var(--muted);font-size:12px;margin-bottom:20px}
.login-box input{margin-bottom:12px}
.login-box button{width:100%;padding:10px}
.login-error{color:var(--red);font-size:12px;margin-top:8px;display:none}

/* Layout */
#app{display:none;height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:180px;background:var(--card);border-right:1px solid var(--border);padding:16px 0;z-index:10}
.sidebar .logo{font-size:14px;font-weight:700;padding:0 16px 16px;border-bottom:1px solid var(--border);margin-bottom:8px;color:var(--green)}
.sidebar a{display:block;padding:8px 16px;color:var(--muted);font-size:12px;transition:all .15s}
.sidebar a:hover,.sidebar a.active{color:var(--text);background:var(--bg)}
.sidebar a.active{border-left:2px solid var(--green);color:var(--green)}
.main{margin-left:180px;padding:24px;height:100vh;overflow-y:auto}
.page{display:none}
.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-header h2{font-size:16px}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:420px;max-width:90vw}
.modal h3{font-size:14px;margin-bottom:16px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Logs */
.log-container{background:#000;border:1px solid var(--border);border-radius:6px;height:calc(100vh - 160px);overflow-y:auto;padding:12px;font-size:11px;line-height:1.6}
.log-line{white-space:pre}
.log-ok{color:var(--green)}
.log-err{color:var(--red)}
.log-slow{color:var(--orange)}

/* Charts */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding:16px 0}
.bar{background:var(--blue);border-radius:2px 2px 0 0;min-width:24px;transition:height .3s;position:relative}
.bar:hover{opacity:.8}
.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>LLM Pico</h1>
    <p>Enter your master key to continue</p>
    <input type="password" id="master-key-input" placeholder="Master Key" autofocus>
    <button onclick="doLogin()" class="primary">Connect</button>
    <div class="login-error" id="login-error">Invalid key</div>
  </div>
</div>

<div id="app">
  <nav class="sidebar">
    <div class="logo">LLM Pico</div>
    <a href="#dashboard" class="active" data-nav="dashboard">Dashboard</a>
    <a href="#keys" data-nav="keys">Keys</a>
    <a href="#teams" data-nav="teams">Teams & Users</a>
    <a href="#budgets" data-nav="budgets">Budgets</a>
    <a href="#usage" data-nav="usage">Usage & Costs</a>
    <a href="#logs" data-nav="logs">Live Logs</a>
  </nav>
  <div class="main">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-keys" class="page"></div>
    <div id="page-teams" class="page"></div>
    <div id="page-budgets" class="page"></div>
    <div id="page-usage" class="page"></div>
    <div id="page-logs" class="page"></div>
  </div>
</div>

<div class="modal-overlay" id="modal"><div class="modal" id="modal-body"></div></div>

<script>
const API_BASE = location.origin;
let MASTER_KEY = localStorage.getItem('pico_master_key') || '';
let logSource = null;

function headers() { return { 'Authorization': `Bearer ${MASTER_KEY}`, 'Content-Type': 'application/json' }; }

async function api(path, opts = {}) {
  const r = await fetch(`${API_BASE}${path}`, { headers: headers(), ...opts });
  if (r.status === 401 || r.status === 403) { logout(); throw new Error('Auth failed'); }
  if (opts.method === 'DELETE') return {};
  const text = await r.text();
  try { return JSON.parse(text); } catch { return text; }
}

async function doLogin() {
  MASTER_KEY = document.getElementById('master-key-input').value.trim();
  if (!MASTER_KEY) return;
  try {
    await api('/health');
    localStorage.setItem('pico_master_key', MASTER_KEY);
    showApp();
  } catch {
    document.getElementById('login-error').style.display = 'block';
  }
}

document.getElementById('master-key-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function logout() {
  localStorage.removeItem('pico_master_key');
  MASTER_KEY = '';
  if (logSource) { logSource.close(); logSource = null; }
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  navigate(location.hash.slice(1) || 'dashboard');
}

function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('active'));
  const el = document.getElementById(`page-${page}`);
  if (el) el.classList.add('active');
  const nav = document.querySelector(`[data-nav="${page}"]`);
  if (nav) nav.classList.add('active');
  if (page === 'dashboard') loadDashboard();
  else if (page === 'keys') loadKeys();
  else if (page === 'teams') loadTeams();
  else if (page === 'budgets') loadBudgets();
  else if (page === 'usage') loadUsage();
  else if (page === 'logs') loadLogs();
}

window.addEventListener('hashchange', () => navigate(location.hash.slice(1)));

function showModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('modal').classList.add('show'); }
function hideModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') hideModal(); });

function ago(iso) {
  if (!iso) return '-';
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function fmt$(n) { return '$' + (n || 0).toFixed(4); }

// Dashboard
async function loadDashboard() {
  const el = document.getElementById('page-dashboard');
  el.innerHTML = '<div class="page-header"><h2>Dashboard</h2><button onclick="loadDashboard()">Refresh</button></div><div class="grid grid-4" id="dash-stats"></div><div class="card" style="margin-top:16px" id="dash-health">Checking health...</div>';
  const [health, keys, teams] = await Promise.all([api('/health').catch(() => null), api('/admin/keys').catch(() => []), api('/admin/teams').catch(() => [])]);
  const usage = await api('/admin/usage').catch(() => ({}));
  const keysArr = Array.isArray(keys) ? keys : [];
  const teamsArr = Array.isArray(teams) ? teams : [];
  document.getElementById('dash-stats').innerHTML = `
    <div class="card stat-card"><div class="val">${keysArr.length}</div><div class="lbl">API Keys</div></div>
    <div class="card stat-card"><div class="val">${teamsArr.length}</div><div class="lbl">Teams</div></div>
    <div class="card stat-card"><div class="val">${usage.total_requests || 0}</div><div class="lbl">Total Requests</div></div>
    <div class="card stat-card"><div class="val">${fmt$(usage.total_cost_usd || 0)}</div><div class="lbl">Total Cost</div></div>`;
  document.getElementById('dash-health').innerHTML = health
    ? `<span class="badge green">Healthy</span> &mdash; Server responding`
    : `<span class="badge red">Unreachable</span> &mdash; Check server`;
}

// Keys
async function loadKeys() {
  const el = document.getElementById('page-keys');
  el.innerHTML = '<div class="page-header"><h2>API Keys</h2><button class="primary" onclick="showCreateKey()">+ Create Key</button></div><div class="card"><table><thead><tr><th>Prefix</th><th>Label</th><th>Active</th><th>User</th><th>Created</th><th></th></tr></thead><tbody id="keys-tbody"><tr><td colspan="6" style="color:var(--muted)">Loading...</td></tr></tbody></table></div>';
  const keys = await api('/admin/keys').catch(() => []);
  const arr = Array.isArray(keys) ? keys : [];
  document.getElementById('keys-tbody').innerHTML = arr.length === 0 ? '<tr><td colspan="6" style="color:var(--muted)">No keys found</td></tr>'
    : arr.map(k => `<tr>
      <td><code style="color:var(--blue)">${k.key_prefix || k.prefix || '-'}</code></td>
      <td>${k.label || '-'}</td>
      <td>${k.is_active !== false ? '<span class="badge green">Active</span>' : '<span class="badge red">Revoked</span>'}</td>
      <td>${k.user_id || '-'}</td>
      <td>${k.created_at ? ago(k.created_at) : '-'}</td>
      <td><button class="danger" onclick="revokeKey('${k.key_prefix || k.prefix}')">Revoke</button></td>
    </tr>`).join('');
}

function showCreateKey() {
  showModal(`<h3>Create API Key</h3>
    <div class="field"><label>Label</label><input id="mk-label" placeholder="e.g. prod-server"></div>
    <div class="field"><label>Models (comma-separated, empty = all)</label><input id="mk-models" placeholder="gpt-4, claude-3"></div>
    <div class="actions"><button onclick="hideModal()">Cancel</button><button class="primary" onclick="createKey()">Create</button></div>`);
}

async function createKey() {
  const label = document.getElementById('mk-label').value.trim();
  const models = document.getElementById('mk-models').value.split(',').map(s=>s.trim()).filter(Boolean);
  const body = { label };
  if (models.length) body.models = models;
  const res = await api('/admin/keys', { method: 'POST', body: JSON.stringify(body) });
  hideModal();
  if (res && res.key) {
    showModal(`<h3>Key Created</h3><p style="margin:12px 0;color:var(--orange)">Copy this key now. It won't be shown again.</p><input readonly value="${res.key}" onclick="this.select()"><div class="actions"><button onclick="hideModal()">Close</button></div>`);
  }
  loadKeys();
}

async function revokeKey(prefix) {
  if (!confirm(`Revoke key ${prefix}?`)) return;
  await api(`/admin/keys/${prefix}`, { method: 'DELETE' });
  loadKeys();
}

// Teams & Users
async function loadTeams() {
  const el = document.getElementById('page-teams');
  el.innerHTML = '<div class="page-header"><h2>Teams & Users</h2><button class="primary" onclick="showCreateTeam()">+ Create Team</button></div><div id="teams-list" class="grid grid-2"></div>';
  const teams = await api('/admin/teams').catch(() => []);
  const arr = Array.isArray(teams) ? teams : [];
  document.getElementById('teams-list').innerHTML = arr.length === 0 ? '<div class="card" style="color:var(--muted)">No teams yet</div>'
    : arr.map(t => `<div class="card" id="team-${t.id}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>${t.name}</strong>
        <div><button onclick="showCreateUser(${t.id})" style="margin-right:6px">+ User</button><button class="danger" onclick="deleteTeam(${t.id})">×</button></div>
      </div>
      ${t.description ? `<div style="color:var(--muted);font-size:11px;margin-bottom:8px">${t.description}</div>` : ''}
      <div style="color:var(--muted);font-size:11px" id="team-users-${t.id}">Loading users...</div>
    </div>`).join('');
  for (const t of arr) loadTeamUsers(t.id);
}

async function loadTeamUsers(teamId) {
  const users = await api(`/admin/teams/${teamId}/users`).catch(() => []);
  const arr = Array.isArray(users) ? users : [];
  const el = document.getElementById(`team-users-${teamId}`);
  if (!el) return;
  el.innerHTML = arr.length === 0 ? 'No users'
    : arr.map(u => `<div style="padding:4px 0;border-top:1px solid var(--border)">${u.email || '-'} <span style="color:var(--muted)">${u.name || ''}</span></div>`).join('');
}

function showCreateTeam() {
  showModal(`<h3>Create Team</h3>
    <div class="field"><label>Name</label><input id="ct-name" placeholder="Team name"></div>
    <div class="field"><label>Description</label><input id="ct-desc" placeholder="Optional"></div>
    <div class="actions"><button onclick="hideModal()">Cancel</button><button class="primary" onclick="createTeam()">Create</button></div>`);
}

async function createTeam() {
  const name = document.getElementById('ct-name').value.trim();
  const description = document.getElementById('ct-desc').value.trim();
  await api('/admin/teams', { method: 'POST', body: JSON.stringify({ name, description }) });
  hideModal(); loadTeams();
}

function showCreateUser(teamId) {
  showModal(`<h3>Add User to Team</h3>
    <div class="field"><label>Email</label><input id="cu-email" placeholder="user@example.com"></div>
    <div class="field"><label>Name</label><input id="cu-name" placeholder="Display name"></div>
    <div class="actions"><button onclick="hideModal()">Cancel</button><button class="primary" onclick="createUser(${teamId})">Create</button></div>`);
}

async function createUser(teamId) {
  const email = document.getElementById('cu-email').value.trim();
  const name = document.getElementById('cu-name').value.trim();
  await api(`/admin/teams/${teamId}/users`, { method: 'POST', body: JSON.stringify({ email, name }) });
  hideModal(); loadTeamUsers(teamId); loadTeams();
}

async function deleteTeam(id) {
  if (!confirm('Delete team and all its users/keys?')) return;
  await api(`/admin/teams/${id}`, { method: 'DELETE' });
  loadTeams();
}

// Budgets
async function loadBudgets() {
  const el = document.getElementById('page-budgets');
  el.innerHTML = '<div class="page-header"><h2>Budgets</h2><button onclick="loadBudgets()">Refresh</button></div><div id="budget-list"></div>';
  const data = await api('/admin/budgets').catch(() => ({ users: [] }));
  const users = data.users || [];
  if (!users.length) { document.getElementById('budget-list').innerHTML = '<div class="card" style="color:var(--muted)">No users found</div>'; return; }
  let html = '';
  for (const u of users) {
    const budget = u.monthly_budget_usd || 0;
    const spent = u.current_spend || 0;
    const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
    const barColor = pct > 90 ? 'var(--red)' : pct > 70 ? 'var(--orange)' : 'var(--green)';
    html += `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <strong>${u.email || u.name || 'User #' + u.id}</strong>
        <span style="color:var(--muted)">${u.team_name || ''}</span>
      </div>
      <div style="display:flex;gap:24px;font-size:11px;color:var(--muted);margin-bottom:8px">
        <span>Budget: ${budget > 0 ? fmt$(budget) : 'None'}</span>
        <span>Spent: ${fmt$(spent)}</span>
        <span>${budget > 0 ? pct.toFixed(1) + '%' : '-'}</span>
      </div>
      ${budget > 0 ? `<div class="progress-bar"><div class="fill" style="width:${pct}%;background:${barColor}"></div></div>` : ''}
    </div>`;
  }
  document.getElementById('budget-list').innerHTML = html;
}

// Usage & Costs
async function loadUsage() {
  const el = document.getElementById('page-usage');
  el.innerHTML = '<div class="page-header"><h2>Usage & Costs</h2><div><select id="cost-group" onchange="loadCosts()"><option value="user">By User</option><option value="model">By Model</option><option value="day">By Day</option></select></div></div>';
  const [usage, topModels] = await Promise.all([api('/admin/usage').catch(() => ({})), api('/admin/usage/top-models').catch(() => [])]);
  const topArr = Array.isArray(topModels) ? topModels : (topModels?.models || []);
  el.innerHTML += `<div class="grid grid-4" style="margin-bottom:16px">
    <div class="card stat-card"><div class="val">${usage.total_requests || 0}</div><div class="lbl">Total Requests</div></div>
    <div class="card stat-card"><div class="val">${(usage.total_tokens || 0).toLocaleString()}</div><div class="lbl">Total Tokens</div></div>
    <div class="card stat-card"><div class="val">${fmt$(usage.total_cost_usd || 0)}</div><div class="lbl">Total Cost</div></div>
    <div class="card stat-card"><div class="val">${usage.active_keys || usage.keys || 0}</div><div class="lbl">Active Keys</div></div>
  </div>
  <div class="grid grid-2">
    <div class="card"><h3 style="font-size:13px;margin-bottom:12px">Top Models</h3><table><thead><tr><th>Model</th><th>Requests</th><th>Tokens</th><th>Cost</th></tr></thead><tbody>
    ${topArr.length === 0 ? '<tr><td colspan="4" style="color:var(--muted)">No data</td></tr>' : topArr.map(m => `<tr><td>${m.model || '-'}</td><td>${m.requests || 0}</td><td>${(m.tokens||0).toLocaleString()}</td><td>${fmt$(m.cost_usd || m.cost || 0)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="card"><h3 style="font-size:13px;margin-bottom:12px">Cost Breakdown</h3><div id="cost-chart"></div></div>
  </div>`;
  loadCosts();
}

async function loadCosts() {
  const group = document.getElementById('cost-group')?.value || 'user';
  const data = await api(`/admin/stats/costs?group_by=${group}`).catch(() => []);
  const arr = Array.isArray(data) ? data : [];
  const el = document.getElementById('cost-chart');
  if (!el) return;
  if (!arr.length) { el.innerHTML = '<div style="color:var(--muted)">No cost data</div>'; return; }
  const max = Math.max(...arr.map(i => i.cost_usd || i.cost || 0), 0.001);
  el.innerHTML = '<div class="bar-chart">' + arr.slice(0, 12).map(i => {
    const val = i.cost_usd || i.cost || 0;
    const h = Math.max(4, (val / max) * 120);
    const label = i.name || i.label || i.group || i.user || i.model || i.day || '?';
    return `<div class="bar" style="height:${h}px;width:${Math.max(24, 100/Math.min(arr.length,12)-4)}px"><div class="bar-label">${label.length > 10 ? label.slice(0,10) : label}</div></div>`;
  }).join('') + '</div><div style="text-align:center;font-size:11px;color:var(--muted);margin-top:24px">' + arr.slice(0, 12).map(i => `${i.name||i.label||'?'}: ${fmt$(i.cost_usd||i.cost||0)}`).join(' &nbsp;&middot;&nbsp; ') + '</div>';
}

// Live Logs
let logConnected = false;
function loadLogs() {
  const el = document.getElementById('page-logs');
  if (!el.classList.contains('active')) return;
  el.innerHTML = '<div class="page-header"><h2>Live Logs</h2><div><button onclick="clearLogs()">Clear</button> <span id="log-status" class="badge green">Connected</span></div></div><div class="log-container" id="log-output"></div>';
  if (logSource) logSource.close();
  logSource = new EventSource(`${API_BASE}/admin/logs/stream`);
  logConnected = true;
  logSource.onmessage = (e) => {
    const out = document.getElementById('log-output');
    if (!out) return;
    const d = e.data || '';
    let cls = '';
    if (d.includes(' 2') && !d.includes(' 20')) cls = 'log-err';
    else if (d.includes(' 4') || d.includes(' 5')) cls = 'log-err';
    const line = document.createElement('div');
    line.className = 'log-line ' + cls;
    line.textContent = d;
    out.appendChild(line);
    if (out.children.length > 500) out.removeChild(out.firstChild);
    out.scrollTop = out.scrollHeight;
  };
  logSource.onerror = () => {
    logConnected = false;
    const s = document.getElementById('log-status');
    if (s) { s.className = 'badge red'; s.textContent = 'Disconnected'; }
  };
}

function clearLogs() { const o = document.getElementById('log-output'); if (o) o.innerHTML = ''; }

// Init
if (MASTER_KEY) { api('/health').then(() => showApp()).catch(() => { MASTER_KEY = ''; }); }
</script>
</body>
</html>
