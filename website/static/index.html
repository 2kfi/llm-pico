<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="LLM Pico — Lightweight LLM API proxy with intelligent routing">
  <title>LLM Pico</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a href="#content" class="sr-only" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:9999" onfocus="this.style.position='fixed';this.style.left='8px';this.style.top='8px';this.style.width='auto';this.style.height='auto';this.style.background='var(--lp-bg)';this.style.padding='8px 16px';this.style.border='1px solid var(--lp-border)';this.style.borderRadius='var(--lp-radius)';this.style.zIndex='9999'" onblur="this.style.position='absolute';this.style.left='-9999px';this.style.width='1px';this.style.height='1px'">Skip to content</a>
  <div id="app">

    <aside id="sidebar" role="navigation" aria-label="Main navigation">
      <header class="lp-sidebar-header">
        <svg class="lp-logo" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect width="28" height="28" rx="6" fill="#22C55E"/>
          <path d="M14 6L8 16h4l-2 6 8-10h-4l2-6z" fill="#fff"/>
        </svg>
        <span class="lp-logo-text">LLM Pico</span>
        <button class="lp-sidebar-collapse-btn" id="sidebar-collapse" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4L6 8l4 4"/></svg>
        </button>
      </header>

      <nav class="lp-sidebar-nav" aria-label="Dashboard navigation">
        <div class="lp-sidebar-section">
          <a class="lp-nav-item active" href="/admin/dashboard/" data-page="overview" aria-current="page">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5.5" height="5.5" rx="1"/><rect x="10.5" y="2" width="5.5" height="5.5" rx="1"/><rect x="2" y="10.5" width="5.5" height="5.5" rx="1"/><rect x="10.5" y="10.5" width="5.5" height="5.5" rx="1"/></svg>
            <span class="lp-sidebar-label">Dashboard</span>
          </a>
        </div>

        <div class="lp-sidebar-section">
          <div class="lp-sidebar-section-title">Resources</div>
          <a class="lp-nav-item" href="/admin/dashboard/models" data-page="models">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 2L2 6v6l7 4 7-4V6L9 2z"/><path d="M2 6l7 4m0 0l7-4m-7 4v6"/></svg>
            <span class="lp-sidebar-label">Models</span>
          </a>
          <a class="lp-nav-item" href="/admin/dashboard/keys" data-page="keys">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 2a4 4 0 00-4 4c0 .5.1 1 .3 1.4L4 10.7V14h3.3l3.3-3.3c.4.2.9.3 1.4.3a4 4 0 000-8z"/><circle cx="9" cy="6" r="1.5" fill="currentColor"/></svg>
            <span class="lp-sidebar-label">Keys</span>
          </a>
        </div>

        <div class="lp-sidebar-section">
          <div class="lp-sidebar-section-title">Organization</div>
          <a class="lp-nav-item" href="/admin/dashboard/teams" data-page="teams">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="5" r="2.5"/><circle cx="12" cy="6" r="2"/><path d="M2 15c0-2.8 2.2-5 5-5s5 2.2 5 5"/><path d="M11 10.5c1.7-.3 3.3.5 4 2"/></svg>
            <span class="lp-sidebar-label">Teams</span>
          </a>
          <a class="lp-nav-item" href="/admin/dashboard/users" data-page="users">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
            <span class="lp-sidebar-label">Users</span>
          </a>
        </div>

        <div class="lp-sidebar-section">
          <div class="lp-sidebar-section-title">Analytics</div>
          <a class="lp-nav-item" href="/admin/dashboard/usage" data-page="usage">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 14h14"/><rect x="3" y="8" width="2.5" height="6" rx="0.5"/><rect x="7.5" y="5" width="2.5" height="9" rx="0.5"/><rect x="12" y="3" width="2.5" height="11" rx="0.5"/></svg>
            <span class="lp-sidebar-label">Usage</span>
          </a>
        </div>

        <div class="lp-sidebar-section">
          <div class="lp-sidebar-section-title">Tools</div>
          <a class="lp-nav-item" href="/admin/dashboard/playground" data-page="playground">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2"/><path d="M6 7l3 3-3 3"/><line x1="11" y1="13" x2="13" y2="13"/></svg>
            <span class="lp-sidebar-label">Playground</span>
          </a>
        </div>

        <div class="lp-sidebar-section">
          <div class="lp-sidebar-section-title">System</div>
          <a class="lp-nav-item" href="/admin/dashboard/settings" data-page="settings">
            <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5v2m0 11v2M1.5 9h2m11 0h2M3.3 3.3l1.4 1.4m8.6 8.6l1.4 1.4M3.3 14.7l1.4-1.4m8.6-8.6l1.4-1.4"/></svg>
            <span class="lp-sidebar-label">Settings</span>
          </a>
        </div>
      </nav>

      <div class="lp-sidebar-footer">
        <button class="lp-nav-item" id="lp-reload-config" aria-label="Reload configuration">
          <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14.5 3.5a7 7 0 00-12.3 4H1"/><path d="M3.5 14.5a7 7 0 0012.3-4H17"/><polyline points="14.5 1 14.5 3.5 12 3.5"/><polyline points="3.5 17 3.5 14.5 6 14.5"/></svg>
          <span class="lp-sidebar-label">Reload Config</span>
        </button>
        <button class="lp-nav-item" id="lp-theme-toggle" aria-label="Toggle theme">
          <svg class="lp-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 9.5A6.5 6.5 0 018.5 3a7 7 0 107 6.5z"/></svg>
          <span class="lp-sidebar-label">Theme</span>
        </button>
        <span class="lp-version">v2.2</span>
      </div>
    </aside>

    <div class="lp-sidebar-backdrop" id="sidebar-backdrop"></div>

    <div id="main-area">
      <header id="top-header">
        <div class="lp-header-left">
          <button class="lp-mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
          </button>
          <span class="lp-header-title" id="page-title">Dashboard</span>
        </div>
        <div class="lp-header-right">
          <button class="lp-header-search" id="search-trigger" aria-label="Search">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
            <span>Search...</span>
            <span class="lp-kbd">⌘K</span>
          </button>
        </div>
      </header>
      <main id="content" role="main"></main>
    </div>

  </div>

  <div id="init-overlay" class="hidden" role="dialog" aria-label="Setup wizard">
    <div class="lp-init-card">
      <div class="lp-progress"><div class="lp-progress-fill"></div></div>
      <div id="init-step"></div>
      <div class="lp-init-nav">
        <button class="lp-btn" id="init-back" aria-label="Go back">Back</button>
        <button class="lp-btn lp-btn-primary" id="init-next">Next</button>
        <button class="lp-btn lp-btn-ghost" id="init-skip">Skip setup</button>
      </div>
    </div>
  </div>

  <div id="toasts" role="status" aria-live="polite"></div>

  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Modal"></div>

  <div id="command-palette" class="hidden" role="dialog" aria-label="Command palette">
    <div class="lp-command-backdrop"></div>
    <div class="lp-command-modal">
      <div class="lp-command-input-wrap">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input type="text" id="command-input" placeholder="Type a command..." autocomplete="off" aria-label="Search commands">
      </div>
      <div class="lp-command-list" id="command-list" role="listbox"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/app.js"></script>
  <script src="js/init.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/models.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/usage.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/trace.js"></script>
  <script src="js/graph.js"></script>
</body>
</html>
